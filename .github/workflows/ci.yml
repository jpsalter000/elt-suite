name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.16.2
  TF_IN_AUTOMATION: "true"
  WAREHOUSE_DSN: postgresql://elt:elt@localhost:5432/warehouse
  # Demo credentials for the bundled mock APIs (not secrets).
  GLOBEX_SHOPFRONT_CLIENT_ID: globex-demo
  GLOBEX_SHOPFRONT_CLIENT_SECRET: globex-demo-secret
  INITECH_TICKETDESK_API_KEY: initech-demo-key
  UMBRELLA_CARTWHEEL_USERNAME: umbrella-demo
  UMBRELLA_CARTWHEEL_PASSWORD: umbrella-demo-password
  HOOLI_HELPLINE_KEY_ID: hooli-demo
  HOOLI_HELPLINE_SECRET: hooli-demo-signing-secret

jobs:
  checks:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    services:
      warehouse:
        image: postgres:16
        env:
          POSTGRES_USER: elt
          POSTGRES_PASSWORD: elt
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elt -d warehouse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest (unit + Postgres integration)
        run: uv run pytest -v -rs

  demo:
    name: Demo pipelines (USGS + mock APIs -> Postgres)
    needs: checks
    runs-on: ubuntu-latest
    services:
      warehouse:
        image: postgres:16
        env:
          POSTGRES_USER: elt
          POSTGRES_PASSWORD: elt
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elt -d warehouse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Uses the committed schemas, so this also catches drift between them and live data.
      - name: First run (from configured lower_bound)
        run: uv run elt run demo_usgs_extract_and_load
      - name: Second run (resumes from saved watermark)
        run: uv run elt run demo_usgs_extract_and_load
      - name: Start mock APIs
        run: |
          nohup uv run elt-mock shopfront > shopfront.log 2>&1 &
          nohup uv run elt-mock ticketdesk > ticketdesk.log 2>&1 &
          nohup uv run elt-mock cartwheel > cartwheel.log 2>&1 &
          nohup uv run elt-mock helpline > helpline.log 2>&1 &
          for port in 8001 8002 8003 8004; do
            timeout 60 bash -c "until curl -sf localhost:$port/docs > /dev/null; do sleep 1; done"
          done
      - name: Mock API pipelines (two runs each)
        run: |
          for consumer in globex_shopfront initech_ticketdesk umbrella_cartwheel hooli_helpline; do
            consumer="${consumer}_extract_and_load"
            uv run elt run $consumer
            uv run elt run $consumer
          done
      - name: Summarize runs
        run: |
          {
            echo "### demo_usgs._runs"
            echo '```'
            psql "$WAREHOUSE_DSN" -c "SELECT job, status, records_loaded, lower_bound, max_incremental_value FROM demo_usgs._runs ORDER BY started_at"
            echo '```'
            for schema in globex_shopfront initech_ticketdesk umbrella_cartwheel hooli_helpline; do
              echo "### $schema._runs"
              echo '```'
              psql "$WAREHOUSE_DSN" -c "SELECT job, status, records_loaded, lower_bound, max_incremental_value FROM $schema._runs ORDER BY started_at"
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  terraform:
    name: Terraform fmt, validate, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive infra
      # Tests use mocked AWS providers, so no credentials are needed.
      - name: Validate and test every module and environment
        run: |
          for dir in infra/modules/* infra/envs/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done

  image:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: elt-suite:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Container smoke tests
        run: uv run pytest -m container -v -rs
        env:
          ELT_IMAGE: elt-suite:test

  # AWS jobs run only once the repository variables from the AWS setup guide exist
  # (AWS_PLAN_ROLE_ARN, AWS_APPLY_ROLE_ARN, TF_STATE_BUCKET); until then they skip.

  plan:
    name: Terraform plan (dev)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PLAN_ROLE_ARN != ''
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=120s \
            -var "image_tag=${{ github.event.pull_request.head.sha }}" | tee plan.txt
          {
            echo "### Terraform plan (dev)"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to AWS (dev)
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_APPLY_ROLE_ARN != ''
    needs: [checks, terraform, image]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Terraform init
        working-directory: infra/envs/dev
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      # The registry must exist before the image can be pushed, and the image must exist
      # before the task definition points at it: registry -> push -> everything else.
      - name: Ensure the ECR repository exists
        working-directory: infra/envs/dev
        run: |
          terraform apply -input=false -auto-approve -lock-timeout=120s \
            -target=module.registry -var "image_tag=$IMAGE_TAG"
          echo "REPOSITORY_URL=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Check whether this commit's image already exists
        id: existing
        run: |
          name="${REPOSITORY_URL##*/}"
          if aws ecr describe-images --repository-name "$name" --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.found != 'true'
      - name: Build and push image (tags are immutable)
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          provenance: false
      - name: Terraform apply
        working-directory: infra/envs/dev
        run: |
          terraform apply -input=false -auto-approve -lock-timeout=120s -var "image_tag=$IMAGE_TAG"
          {
            echo "### Deployed \`$IMAGE_TAG\` to dev"
            echo "Run the task:"
            echo '```bash'
            network=$(terraform output -json run_task_network \
              | jq -c '{awsvpcConfiguration: {subnets, securityGroups: .security_groups, assignPublicIp: .assign_public_ip}}')
            echo "aws ecs run-task --cluster $(terraform output -raw cluster_name) --launch-type FARGATE \\"
            echo "  --task-definition $(terraform output -raw task_definition_family) \\"
            echo "  --network-configuration '$network'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
