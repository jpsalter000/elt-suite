          - {account_id: 108, account_number: "40120", account_type: Income}
          - {account_id: 109, account_number: "50100", account_type: COGS}
          - {account_id: 110, account_number: "50200", account_type: COGS}
          - {account_id: 111, account_number: "50300", account_type: COGS}
