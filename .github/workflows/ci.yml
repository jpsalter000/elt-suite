name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WAREHOUSE_DSN: postgresql://elt:elt@localhost:5432/warehouse
  # Demo credentials for the bundled mock APIs (not secrets).
  GLOBEX_SHOPFRONT_CLIENT_ID: globex-demo
  GLOBEX_SHOPFRONT_CLIENT_SECRET: globex-demo-secret
  INITECH_TICKETDESK_API_KEY: initech-demo-key
  UMBRELLA_CARTWHEEL_USERNAME: umbrella-demo
  UMBRELLA_CARTWHEEL_PASSWORD: umbrella-demo-password
  HOOLI_HELPLINE_KEY_ID: hooli-demo
  HOOLI_HELPLINE_SECRET: hooli-demo-signing-secret

jobs:
  checks:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    services:
      warehouse:
        image: postgres:16
        env:
          POSTGRES_USER: elt
          POSTGRES_PASSWORD: elt
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elt -d warehouse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest (unit + Postgres integration)
        run: uv run pytest -v -rs

  demo:
    name: Demo pipelines (USGS + mock APIs -> Postgres)
    needs: checks
    runs-on: ubuntu-latest
    services:
      warehouse:
        image: postgres:16
        env:
          POSTGRES_USER: elt
          POSTGRES_PASSWORD: elt
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elt -d warehouse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Uses the committed schemas, so this also catches drift between them and live data.
      - name: First run (from configured lower_bound)
        run: uv run elt run demo_usgs_extract_and_load
      - name: Second run (resumes from saved watermark)
        run: uv run elt run demo_usgs_extract_and_load
      - name: Start mock APIs
        run: |
          nohup uv run elt-mock shopfront > shopfront.log 2>&1 &
          nohup uv run elt-mock ticketdesk > ticketdesk.log 2>&1 &
          nohup uv run elt-mock cartwheel > cartwheel.log 2>&1 &
          nohup uv run elt-mock helpline > helpline.log 2>&1 &
          for port in 8001 8002 8003 8004; do
            timeout 60 bash -c "until curl -sf localhost:$port/docs > /dev/null; do sleep 1; done"
          done
      - name: Mock API pipelines (two runs each)
        run: |
          for consumer in globex_shopfront initech_ticketdesk umbrella_cartwheel hooli_helpline; do
            consumer="${consumer}_extract_and_load"
            uv run elt run $consumer
            uv run elt run $consumer
          done
      - name: Summarize runs
        run: |
          {
            echo "### demo_usgs._runs"
            echo '```'
            psql "$WAREHOUSE_DSN" -c "SELECT job, status, records_loaded, lower_bound, max_incremental_value FROM demo_usgs._runs ORDER BY started_at"
            echo '```'
            for schema in globex_shopfront initech_ticketdesk umbrella_cartwheel hooli_helpline; do
              echo "### $schema._runs"
              echo '```'
              psql "$WAREHOUSE_DSN" -c "SELECT job, status, records_loaded, lower_bound, max_incremental_value FROM $schema._runs ORDER BY started_at"
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
