[project]
name = "elt-suite"
version = "0.1.0"
description = "Config-driven extract-and-load framework with schema inference and pluggable source clients."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
elt = "elt_suite.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elt_suite", "src/consumers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running Postgres (set WAREHOUSE_DSN)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["elt_suite", "consumers", "conftest"]
