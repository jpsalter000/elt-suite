[project]
name = "elt-suite"
version = "0.1.0"
description = "Config-driven extract-and-load framework with schema inference and pluggable source clients."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
elt = "elt_suite.cli:app"
elt-mock = "mock_apis.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.3",
    "ruff>=0.6",
]
mock = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv]
default-groups = ["dev", "mock"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elt_suite", "src/consumers", "src/mock_apis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running Postgres (set WAREHOUSE_DSN)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["elt_suite", "consumers", "mock_apis", "conftest"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
